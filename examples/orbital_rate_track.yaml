# Orbital rate-track mode: TLE-based physics with SSTRC7 stars.
# Sensor tracks the primary target (first object), so it appears stationary
# and stars streak. Secondary targets drift at their relative rate.
#
# Requires: satkit, httpx, astropy (for SSTRC7)
#
# Usage:
#   import sdasim
#   scene = sdasim.Scene.from_yaml("examples/orbital_rate_track.yaml")
#   images, annotations = scene.render_sequence()
#   sdasim.io.write_sequence(images, annotations, "output/orbital_rate_track/")

site:
  latitude: 20.8195       # degrees
  longitude: -156.2795    # degrees
  altitude: 50.0     # meters

tracking: sidereal

objects:
  - norad_id: "21639"
    mv: 12.1
#  - norad_id: "25994"  # secondary target
#    mv: 14.0
#    dither_arcsec: 5.0

sensor:
  height: 1024
  width: 1024
  y_fov: 0.69
  x_fov: 0.69
  exposure: 2.0
  gap: 0.5
  num_frames: 8
  zeropoint: 23.5
  psf_sigma: 0.6
  dark_current: 1.0
  read_noise: 2.4
  electronic_noise: 5.0
  is_cmos: True
  background_mv: 19.0
  bias: 50.0
  gain: 0.37
  fwc: 30260
  a2d_bias: 500.0
  a2d_dtype: uint16

stars:
  mode: sstrc7
  catalog_path: /opt/data/sstrc7
  # ra/dec auto-derived from primary target pointing

star_motion:
  temporal_osf: 100

#obs_time: "2026-03-21T04:00:00Z"
seed: 42
device: auto
enable_shot_noise: true
enable_read_noise: true
