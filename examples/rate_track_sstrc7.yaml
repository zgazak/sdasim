# Rate-track mode with SSTRC7 real star catalog.
# Uses actual star positions/magnitudes for a given pointing direction
# instead of statistically generated stars.
#
# Requires: astropy (for WCS projection)
#   pip install astropy
#
# Usage:
#   import sdasim
#   scene = sdasim.Scene.from_yaml("examples/rate_track_sstr7.yaml")
#   images, annotations = scene.render_sequence()
#   sdasim.io.write_sequence(images, annotations, "output/rate_track_sstr7/")

sensor:
  height: 512
  width: 512
  y_fov: 0.5          # degrees
  x_fov: 0.5
  exposure: 2.0        # seconds
  gap: 0.5
  num_frames: 8
  zeropoint: 23.5
  psf_sigma: 0.6
  dark_current: 1.0
  read_noise: 1.0
  electronic_noise: 5.0
  background_mv: 21.0
  bias: 50.0
  gain: 8.0
  fwc: 100000.0
  a2d_bias: 500.0
  a2d_dtype: uint16

stars:
  mode: sstrc7
  ra: 180.0            # pointing RA (degrees) — Virgo cluster region
  dec: 12.0            # pointing Dec (degrees)
  rot: 0.0             # field rotation (degrees)
  pad_mult: 1.0        # padding multiplier for stars outside FOV
  catalog_path: /opt/data/sstrc7

star_motion:
  rotation: 0.0
  translation: [3.0, -5.0]   # stars drift at ~5.8 px/sec (rate-track)
  temporal_osf: 100

targets:
  - mode: line
    origin: [0.5, 0.5]
    velocity: [0.2, -0.1]
    mv: 14.0

  - mode: line
    origin: [0.3, 0.7]
    velocity: [0.1, 0.0]
    mv: 12.0

seed: 42
device: auto
enable_shot_noise: true
enable_read_noise: true
