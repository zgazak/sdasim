# Sidereal mode: sensor tracks the stars (fixed pointing on sky),
# so stars are point sources and targets streak across the frame.
#
# Usage:
#   import sdasim
#   scene = sdasim.Scene.from_yaml("examples/sidereal.yaml")
#   images, annotations = scene.render_sequence()
#   sdasim.io.write_sequence(images, annotations, "output/sidereal/")

sensor:
  height: 1024
  width: 1024
  y_fov: 0.5
  x_fov: 0.5
  exposure: 1.0        # shorter exposure — stars are sharp
  gap: 0.25
  num_frames: 8
  zeropoint: 23.5
  psf_sigma: 0.6
  dark_current: 10.0
  read_noise: 10.0
  electronic_noise: 5.0
  background_mv: 21.0
  bias: 50.0
  gain: 8.0
  fwc: 100000.0
  a2d_bias: 500.0
  a2d_dtype: uint16

stars:
  mode: sstr7

# No star motion — sensor tracks the star field (sidereal tracking).
star_motion:
  rotation: 0.0
  translation: [0.0, 0.0]
  temporal_osf: 1             # no motion blur needed for stars

# Targets move across the FOV — they streak during exposure.
# velocity is [row, col] in pixels/sec.
targets:
  - mode: line
    origin: [0.1, 0.1]         # enters from upper-left
    velocity: [8.0, 12.0]      # fast-moving LEO object
    mv: 12.0

  - mode: line
    origin: [0.8, 0.2]
    velocity: [-3.0, 6.0]      # slower GEO object
    mv: 15.0

  - mode: line
    origin: [0.5, 0.9]
    velocity: [1.0, -4.0]
    mv: 13.5

seed: 123
device: auto
enable_shot_noise: true
enable_read_noise: true
