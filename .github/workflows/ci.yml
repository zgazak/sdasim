# Lint, test, and build-check on every push and pull request.
#
# Uses uv with the committed uv.lock so CI runs the same tool versions as
# `make lint` / `make test` locally. Installing tools unpinned lets a new ruff
# release turn CI red on untouched code.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Sets UV_PYTHON, so `uv sync` and `uv run` agree. Passing --python
          # to sync alone is not enough: a later bare `uv run` re-resolves to
          # uv's default interpreter and silently rebuilds the venv without
          # the extras.
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        # Pulls torch and its CUDA stack (~2.5 GB). The uv cache above keeps
        # this to a one-time cost per lockfile change.
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*
